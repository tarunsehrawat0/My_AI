services:
  - type: web
    name: fresh-cuts-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
      - key: PORT
        value: 10000
