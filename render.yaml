services:
  - type: web
    name: fresh-cuts-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
      - key: PORT
        value: 10000
      - key: USE_WEBHOOK
        value: true
      - key: RENDER_EXTERNAL_URL
        value: https://fresh-cuts-bot.onrender.com
